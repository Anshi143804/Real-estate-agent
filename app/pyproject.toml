[project]
name = "estate-ai-assistant"
version = "0.1.0"
description = "AI-powered Estate Agency Assistant built with Pipecat Flows, Gemini and FastAPI."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # ===========================
    # Web
    # ===========================
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",

    # ===========================
    # Database
    # ===========================
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.16.5",

    # ===========================
    # Environment
    # ===========================
    "python-dotenv>=1.1.1",

    # ===========================
    # Validation
    # ===========================
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",

    # ===========================
    # AI
    # ===========================
    "google-genai>=1.31.0",

    # ===========================
    # Pipecat
    # ===========================
    "pipecat-ai[google,deepgram,cartesia,silero,websocket]>=1.5.0",

    # ===========================
    # Email
    # ===========================
    "resend>=2.13.1",

    # ===========================
    # Utilities
    # ===========================
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "orjson>=3.11.2",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.1.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"